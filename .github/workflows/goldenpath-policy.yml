name: GoldenPath request policy
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]
permissions:
  contents: read
  pull-requests: read
  checks: write
jobs:
  verify-request:
    if: startsWith(github.head_ref, 'goldenpath/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - run: python3 -m pip install -r scripts/requirements.txt
      - name: Validate PR as data with trusted base-branch policy
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/validate-request.py --repo "$GITHUB_REPOSITORY" --pr "$PR_NUMBER" --sha "$PR_SHA"
      - name: Report policy result for the exact head commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          RESULT: ${{ steps.policy.outcome == 'success' && 'success' || 'failure' }}
        run: gh api -X POST "repos/$GITHUB_REPOSITORY/check-runs" -f name=goldenpath-policy -f head_sha="$PR_SHA" -f status=completed -f conclusion="$RESULT"
