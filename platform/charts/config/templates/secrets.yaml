{{- if or (eq .Values.stage "all") (eq .Values.stage "resources") }}
apiVersion: v1
kind: Namespace
metadata: {name: backstage}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata: {name: goldenpath-aws}
spec:
  conditions:
    - namespaces: [backstage, argocd]
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.aws.region }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: backstage-database, namespace: backstage}
spec:
  refreshInterval: 1h
  secretStoreRef: {name: goldenpath-aws, kind: ClusterSecretStore}
  target:
    name: backstage-database
    template:
      data:
        POSTGRES_HOST: {{ .Values.backstage.databaseHost | quote }}
        POSTGRES_USER: '{{ "{{ .username }}" }}'
        POSTGRES_PASSWORD: '{{ "{{ .password }}" }}'
  dataFrom:
    - extract: {key: {{ .Values.backstage.databaseSecretArn | quote }}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: backstage-github, namespace: backstage}
spec:
  refreshInterval: 1h
  secretStoreRef: {name: goldenpath-aws, kind: ClusterSecretStore}
  target: {name: backstage-github}
  dataFrom:
    - extract: {key: {{ .Values.githubSecretArn | quote }}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: github-repositories, namespace: argocd}
spec:
  refreshInterval: 1h
  secretStoreRef: {name: goldenpath-aws, kind: ClusterSecretStore}
  target:
    name: github-repositories
    template:
      metadata:
        labels: {argocd.argoproj.io/secret-type: repo-creds}
      data:
        type: git
        url: https://github.com/{{ .Values.git.owner }}
        username: x-access-token
        password: '{{ "{{ .GITHUB_TOKEN }}" }}'
  dataFrom:
    - extract: {key: {{ .Values.githubSecretArn | quote }}}
{{- end }}
