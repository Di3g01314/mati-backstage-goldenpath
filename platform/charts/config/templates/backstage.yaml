{{- if or (eq .Values.stage "all") (eq .Values.stage "backstage") }}
apiVersion: v1
kind: ServiceAccount
metadata: {name: backstage, namespace: backstage}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: backstage-observer, namespace: {{ .Values.pilot.namespace }}}
rules:
  - apiGroups: ['', apps, batch, autoscaling, networking.k8s.io]
    resources: [pods, pods/log, services, configmaps, limitranges, resourcequotas, events, deployments, replicasets, statefulsets, daemonsets, jobs, cronjobs, horizontalpodautoscalers, ingresses]
    verbs: [get, list, watch]
  - apiGroups: [platform.goldenpath.io]
    resources: [postgresqlinstances]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: backstage-observer, namespace: {{ .Values.pilot.namespace }}}
subjects: [{kind: ServiceAccount, name: backstage, namespace: backstage}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: backstage-observer}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: backstage, namespace: backstage}
spec:
  replicas: 1
  selector: {matchLabels: {app: backstage}}
  template:
    metadata: {labels: {app: backstage}}
    spec:
      serviceAccountName: backstage
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: backstage
          image: {{ .Values.backstage.image | quote }}
          ports: [{name: http, containerPort: 7007}]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: '1', memory: 1536Mi}
          env:
            - {name: PORTAL_URL, value: {{ .Values.portalUrl | quote }}}
            - {name: PORTAL_ORIGIN, value: {{ regexFind "^https?://[^/]+" .Values.portalUrl | quote }}}
            - {name: GITHUB_OWNER, value: {{ .Values.git.owner | quote }}}
            - {name: GITOPS_REPO, value: {{ .Values.git.repo | quote }}}
            - {name: SERVICE_IMAGE, value: {{ .Values.serviceImage | quote }}}
          envFrom:
            - secretRef: {name: backstage-database}
            - secretRef: {name: backstage-github}
          readinessProbe: {httpGet: {path: /.backstage/health/v1/readiness, port: http}, initialDelaySeconds: 15, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /.backstage/health/v1/liveness, port: http}, initialDelaySeconds: 30, periodSeconds: 20}
---
apiVersion: v1
kind: Service
metadata: {name: backstage, namespace: backstage}
spec:
  selector: {app: backstage}
  ports: [{name: http, port: 7007, targetPort: http}]
---
apiVersion: networking.istio.io/v1
kind: Gateway
metadata: {name: backstage, namespace: backstage}
spec:
  selector: {istio: ingressgateway}
  servers:
    - port: {number: 80, name: http, protocol: HTTP}
      hosts: ['*']
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata: {name: backstage, namespace: backstage}
spec:
  hosts: ['*']
  gateways: [backstage]
  http:
    - route:
        - destination: {host: backstage.backstage.svc.cluster.local, port: {number: 7007}}
{{- end }}
