apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: goldenpath-runtime
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "-20"}
spec:
  project: platform
  source:
    repoURL: {{ .Values.git.repoURL | quote }}
    targetRevision: {{ .Values.git.revision | quote }}
    path: platform/charts/config
    helm:
      releaseName: goldenpath-runtime
      valuesObject:
        {{- $values := deepCopy .Values }}
        {{- $_ := set $values "stage" "runtime" }}
        {{- toYaml $values | nindent 8 }}
  destination: {server: 'https://kubernetes.default.svc', namespace: argocd}
  syncPolicy:
    automated: {prune: false, selfHeal: true}
    syncOptions: [ServerSideApply=true]
    retry:
      limit: 15
      backoff: {duration: 10s, factor: 2, maxDuration: 3m}
---
